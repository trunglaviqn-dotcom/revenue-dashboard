<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Revenue Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-6">

    <div class="max-w-7xl mx-auto">
        <h1 class="text-3xl font-bold mb-8 text-gray-900">Quản trị Doanh thu Khách sạn (Manual Entry)</h1>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="bg-white p-6 rounded-xl shadow-md lg:col-span-1">
                <h2 class="text-xl font-bold mb-4 border-b pb-2">Nhập liệu Hàng ngày</h2>
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700">Tổng số phòng (Inventory)</label>
                    <input type="number" id="totalRooms" value="208" class="mt-1 w-full p-2 border border-gray-300 rounded focus:ring-blue-500 focus:border-blue-500" readonly>
                    <small class="text-gray-500">Mặc định theo cấu trúc khách sạn</small>
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700">Số phòng đã bán (Rooms Sold)</label>
                    <input type="number" id="roomsSold" placeholder="VD: 145" class="mt-1 w-full p-2 border border-gray-300 rounded focus:ring-blue-500 focus:border-blue-500">
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700">Tổng doanh thu (VND)</label>
                    <input type="number" id="totalRevenue" placeholder="VD: 312500000" class="mt-1 w-full p-2 border border-gray-300 rounded focus:ring-blue-500 focus:border-blue-500">
                </div>

                <button onclick="calculateAndRender()" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded hover:bg-blue-700 transition">
                    Cập nhật Dashboard
                </button>
            </div>

            <div class="lg:col-span-2 space-y-6">
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="bg-white p-5 rounded-xl shadow-md border-l-4 border-blue-500">
                        <p class="text-sm text-gray-500 font-medium uppercase">Occupancy</p>
                        <p class="text-3xl font-bold text-gray-800 mt-1" id="kpi-occ">0%</p>
                    </div>
                    <div class="bg-white p-5 rounded-xl shadow-md border-l-4 border-green-500">
                        <p class="text-sm text-gray-500 font-medium uppercase">ADR (Giá bình quân)</p>
                        <p class="text-3xl font-bold text-gray-800 mt-1" id="kpi-adr">0</p>
                    </div>
                    <div class="bg-white p-5 rounded-xl shadow-md border-l-4 border-indigo-500">
                        <p class="text-sm text-gray-500 font-medium uppercase">RevPAR</p>
                        <p class="text-3xl font-bold text-gray-800 mt-1" id="kpi-revpar">0</p>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-md">
                    <h3 class="text-lg font-bold mb-4">Biểu đồ Kinerja Tức thời</h3>
                    <canvas id="revenueChart" height="100"></canvas>
                </div>

            </div>
        </div>
    </div>

    <script>
        // Hàm định dạng số theo chuẩn Việt Nam (Dấu . cho hàng nghìn)
        function formatVN(number) {
            return new Intl.NumberFormat('vi-VN').format(Math.round(number));
        }

        let myChart = null; // Biến lưu trữ biểu đồ

        function calculateAndRender() {
            // 1. Lấy dữ liệu từ ô nhập liệu
            const totalRooms = parseFloat(document.getElementById('totalRooms').value) || 0;
            const roomsSold = parseFloat(document.getElementById('roomsSold').value) || 0;
            const totalRevenue = parseFloat(document.getElementById('totalRevenue').value) || 0;

            if (roomsSold === 0 || totalRevenue === 0) {
                alert("Vui lòng nhập số phòng đã bán và doanh thu!");
                return;
            }

            // 2. Tính toán các chỉ số
            const occupancy = (roomsSold / totalRooms) * 100;
            const adr = totalRevenue / roomsSold;
            const revpar = totalRevenue / totalRooms;

            // 3. Hiển thị lên KPI Cards
            document.getElementById('kpi-occ').innerText = occupancy.toFixed(2).replace('.', ',') + '%';
            document.getElementById('kpi-adr').innerText = formatVN(adr) + ' ₫';
            document.getElementById('kpi-revpar').innerText = formatVN(revpar) + ' ₫';

            // 4. Vẽ lại biểu đồ
            renderChart(adr, revpar);
        }

        function renderChart(currentAdr, currentRevpar) {
            const ctx = document.getElementById('revenueChart').getContext('2d');
            
            // Xóa biểu đồ cũ nếu có để vẽ cái mới
            if (myChart != null) {
                myChart.destroy();
            }

            // Dữ liệu mô phỏng các ngày trước đó + ngày hiện tại vừa nhập
            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Hôm kia', 'Hôm qua', 'Hôm nay (Vừa nhập)'],
                    datasets: [
                        {
                            label: 'ADR (VND)',
                            data: [1150000, 1200000, currentAdr],
                            backgroundColor: 'rgba(34, 197, 94, 0.7)', // Màu xanh lá
                            borderColor: 'rgb(34, 197, 94)',
                            borderWidth: 1
                        },
                        {
                            label: 'RevPAR (VND)',
                            data: [850000, 920000, currentRevpar],
                            backgroundColor: 'rgba(99, 102, 241, 0.7)', // Màu xanh dương
                            borderColor: 'rgb(99, 102, 241)',
                            borderWidth: 1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: function(value) {
                                    return formatVN(value);
                                }
                            }
                        }
                    },
                    plugins: {
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return context.dataset.label + ': ' + formatVN(context.raw) + ' ₫';
                                }
                            }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
